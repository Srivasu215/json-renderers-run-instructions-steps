<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monaco Studio V3 — Dynamic 1-2-3 JSON Studio | json-renderers-run-instructions-steps</title>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Monaco Editor Stylesheet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
    
    <!-- CSS Divided as per HTML Controls -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/workspace.css">
    <link rel="stylesheet" href="./css/footer.css">
</head>

<body>
    <div class="studio-app">
        <!-- Top Bar Header Section -->
        <header class="studio-header">
            <!-- Left: Brand & Docs Navigation -->
            <div class="header-left">
                <a href="../../index.html" class="brand-link" title="Back to Docs">
                    <i class="bi bi-cpu-fill brand-icon"></i>
                    <span>json-renderers-run-instructions-steps</span>
                    <span class="version-pill">v3</span>
                </a>

                <div class="header-divider"></div>

                <!-- Dynamic 1-2-3 Layout Switcher -->
                <div class="layout-switcher">
                    <span class="layout-switcher-label">Panes:</span>
                    <button type="button" class="btn-layout-mode" data-panes="1" title="Single Pane (100%)">1</button>
                    <button type="button" class="btn-layout-mode active" data-panes="2" title="Double Pane (50/50)">2</button>
                    <button type="button" class="btn-layout-mode" data-panes="3" title="Triple Pane (33/33/33)">3</button>
                </div>
            </div>

            <!-- Right: Status & Documentation Link -->
            <div class="header-right">
                <!-- Status Notification -->
                <span id="statusPill" class="status-pill success hidden">
                    <i class="bi bi-check2"></i> <span id="statusText">Loaded ✓</span>
                </span>

                <div class="header-divider"></div>

                <a href="../../index.html" class="docs-link" title="Documentation Hub">
                    <i class="bi bi-arrow-left"></i>
                    <span>Docs</span>
                </a>
            </div>
        </header>

        <!-- Main Workspace Section: Dynamic 1, 2, or 3 Studio Panes -->
        <main class="studio-workspace" id="studioWorkspace" data-panes="2">
            <!-- Pane 1: Editor 1 (instructions.json) -->
            <section class="studio-pane" id="pane1">
                <div class="pane-header">
                    <div class="pane-header-left">
                        <span class="pane-badge">Editor 1</span>
                        <button id="openFileBtn1" type="button" class="btn-pane-file" title="Open JSON file for Editor 1">
                            <i class="bi bi-folder2-open"></i>
                            <span>Select File</span>
                        </button>
                        <input type="file" id="fileInput1" style="display: none;" accept=".json,.js,.txt,application/json">
                    </div>
                    <div class="pane-header-right">
                        <span class="pane-file-pill">
                            <i class="bi bi-filetype-json"></i>
                            <span id="fileName1" class="pane-file-name">instructions.json</span>
                        </span>
                    </div>
                </div>
                <div id="editor1" class="editor-pane-body"></div>
            </section>

            <!-- Pane 2: Editor 2 (data.json) -->
            <section class="studio-pane" id="pane2">
                <div class="pane-header">
                    <div class="pane-header-left">
                        <span class="pane-badge">Editor 2</span>
                        <button id="openFileBtn2" type="button" class="btn-pane-file" title="Open JSON file for Editor 2">
                            <i class="bi bi-folder2-open"></i>
                            <span>Select File</span>
                        </button>
                        <input type="file" id="fileInput2" style="display: none;" accept=".json,.js,.txt,application/json">
                    </div>
                    <div class="pane-header-right">
                        <span class="pane-file-pill">
                            <i class="bi bi-filetype-json"></i>
                            <span id="fileName2" class="pane-file-name">data.json</span>
                        </span>
                    </div>
                </div>
                <div id="editor2" class="editor-pane-body"></div>
            </section>

            <!-- Pane 3: Editor 3 (columns.json) -->
            <section class="studio-pane" id="pane3">
                <div class="pane-header">
                    <div class="pane-header-left">
                        <span class="pane-badge">Editor 3</span>
                        <button id="openFileBtn3" type="button" class="btn-pane-file" title="Open JSON file for Editor 3">
                            <i class="bi bi-folder2-open"></i>
                            <span>Select File</span>
                        </button>
                        <input type="file" id="fileInput3" style="display: none;" accept=".json,.js,.txt,application/json">
                    </div>
                    <div class="pane-header-right">
                        <span class="pane-file-pill">
                            <i class="bi bi-filetype-json"></i>
                            <span id="fileName3" class="pane-file-name">columns.json</span>
                        </span>
                    </div>
                </div>
                <div id="editor3" class="editor-pane-body"></div>
            </section>
        </main>

        <!-- Footer Status Section -->
        <footer class="studio-footer">
            <div class="footer-left">
                <span class="footer-brand">
                    <i class="bi bi-layout-split"></i>
                    <span>Monaco Dynamic Studio</span>
                </span>
                <span>|</span>
                <span id="layoutMeta">2 Panes Active</span>
            </div>
            <div class="footer-right">
                <span id="cursorPos">Ln 1, Col 1</span>
            </div>
        </footer>
    </div>

    <!-- Monaco AMD Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    
    <!-- Functional Controller -->
    <script type="module" src="./js/index.js"></script>
</body>

</html>
