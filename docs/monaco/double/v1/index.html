<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Monaco V2 — Modular Control CSS Studio | json-renderers-run-instructions-steps</title>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Monaco Editor Stylesheet -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/editor/editor.main.min.css">
    
    <!-- CSS Divided as per HTML Controls -->
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/workspace.css">
    <link rel="stylesheet" href="./css/footer.css">
</head>

<body>
    <div class="studio-app">
        <!-- Top Bar Header Section -->
        <header class="studio-header">
            <!-- Left: Brand & File Operations -->
            <div class="header-left">
                <a href="../../index.html" class="brand-link" title="Back to Docs">
                    <i class="bi bi-cpu-fill brand-icon"></i>
                    <span>json-renderers-run-instructions-steps</span>
                    <span class="version-pill">v2</span>
                </a>

                <div class="header-divider"></div>

                <!-- File Button (Click or Ctrl+O) -->
                <button id="openFileBtn" type="button" class="btn-file" title="Open JSON file from disk (Ctrl+O)">
                    <i class="bi bi-folder2-open"></i>
                    <span>File</span>
                </button>
                <input type="file" id="fileInput" style="display: none;" accept=".json,.js,.txt,application/json">
            </div>

            <!-- Right: Active File Pill, Status & Navigation -->
            <div class="header-right">
                <!-- Status Notification -->
                <span id="statusPill" class="status-pill success hidden">
                    <i class="bi bi-check2"></i> <span id="statusText">Loaded ✓</span>
                </span>

                <!-- Active File Pill -->
                <div class="active-file-pill">
                    <i class="bi bi-filetype-json"></i>
                    <span class="active-file-label">Active:</span>
                    <span id="fileName" class="active-file-name">instructions.json</span>
                </div>

                <div class="header-divider"></div>

                <a href="../../index.html" class="docs-link" title="Documentation Hub">
                    <i class="bi bi-arrow-left"></i>
                    <span>Docs</span>
                </a>
            </div>
        </header>

        <!-- Main Workspace Section -->
        <main class="studio-workspace">
            <div id="jsonEditor" class="editor-surface"></div>
        </main>

        <!-- Footer Status Section -->
        <footer class="studio-footer">
            <div class="footer-left">
                <span class="footer-brand">
                    <i class="bi bi-code-slash"></i>
                    <span>Monaco Studio</span>
                </span>
                <span>|</span>
                <span id="fileMeta">JSON Model</span>
            </div>
            <div class="footer-right">
                <span id="cursorPos">Ln 1, Col 1</span>
            </div>
        </footer>
    </div>

    <!-- Monaco AMD Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
    
    <!-- Functional Controller -->
    <script type="module" src="./js/index.js"></script>
</body>

</html>
